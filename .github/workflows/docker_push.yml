# GitHub actions workflow which builds and publishes the docker images.

name: Build and push docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# cancel multiple workflow_dispatch on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout codebase
      attestations: write # gh attestations
      id-token: write     # for cosign and actions/attest
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Inspect builder
        run: docker buildx inspect

      - name: Log in to DockerHub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Calculate docker image tags
        id: set-tag
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: matrixdotorg/sygnal
          tags: |
            type=ref,event=tag

      # we explicitly check out the repository (and use `context: .` in buildx)
      # because we need to preserve the git metadata so that setuptools_scm
      # (part of build system config in pyproject.toml) can deduce the package version.
      # See: https://github.com/marketplace/actions/build-and-push-docker-images#path-context
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push all platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-and-push
        with:
          context: .
          push: true
          labels: "gitsha1=${{ github.sha }}"
          tags: "${{ steps.set-tag.outputs.tags }}"
          file: "docker/Dockerfile"
          platforms: linux/amd64,linux/arm64
          # `docker/build-push-action` v6/v7 enables `provenance=true` by default.
          # Buildkit bundles attestation manifests in the image index as unknown platform entries.
          # https://github.com/goharbor/harbor/issues/22848
          # Prefer tooling able to publish attestations (sbom and provenance) using the OCI referrers API.
          # This is the standard way to associate OCI artifacts without affecting the image digest
          # https://oras.land/docs/concepts/reftypes#the-art-of-associating-artifacts
          provenance: false
          sbom: false
          # Buildkit default is OCI iff attestations are present, type=oci is set
          # to ensure the image remains an OCI index. Shouldn't break anything but why risk it
          # https://github.com/opencontainers/image-spec/blob/main/media-types.md
          outputs: type=oci

      # generate container SBOM once per arch based on the image's digest
      - name: Generate SBOM using Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: docker.io/matrixdotorg/sygnal@${{ steps.build-and-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-container.cdx.json
          upload-artifact: true
          upload-artifact-retention: 1
          upload-release-assets: false

      # attest the SBOM to the image's index manifest digest.
      # `push-to-registry` also stores the attestation as an OCI 1.1 referrer
      - name: Attest and push SBOM to docker.io
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6      # v4.2.0
        with:
          subject-name: docker.io/matrixdotorg/sygnal
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          sbom-path: sbom-container.cdx.json
          push-to-registry: true

      # Build provenance (SLSA L2+). Attest to the image's index manifest digest.
      # `push-to-registry` stores the attestation as an OCI 1.1 referrer
      - name: Provenance (docker.io)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6   # v4.2.0
        with:
          subject-name: docker.io/matrixdotorg/sygnal
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      # --recursively signs the image index and the downstream platform/arch manifests
      - name: Sign the images with GitHub's OIDC Token
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
            cosign sign --yes --recursive "docker.io/matrixdotorg/sygnal@${DIGEST}"

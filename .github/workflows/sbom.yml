# GitHub actions workflow which generates a source SBOM and uploads it to Dependency-Track.
# It also owns the per-release Dependency-Track "collection" project. Only the source project
# is attached to it today -- docker.yml uploads its image projects without a parent link, so
# they are tagged alike but not yet aggregated.
name: Generate SBOM

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # trigger manually

# Disable all permissions for the GITHUB_TOKEN access token by default.
permissions: {}

# cancel multiple workflows running on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mirrors the tag rules docker.yml feeds to metadata-action, so that the parent project
  # created here is at the same version the image sbom uploads attach themselves to.
  PROJECT_VERSION: >-
    ${{ github.ref == 'refs/heads/develop' && 'develop'
     || (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'latest'
     || github.ref_name }}
  # The release collection project every SBOM for this tag hangs off. Children attach to it by
  # setting parent-name/parent-version to these values.
  PARENT_PROJECT_NAME: ${{ github.repository }}
  SOURCE_PROJECT_NAME: ${{ github.repository }} - source
  # Tags for portfolio filtering, applied to the collection project and to the source project
  # below. Not load-bearing: AGGREGATE_DIRECT_CHILDREN rolls children up by parent link, not
  # by tag.
  PROJECT_TAGS: ${{ github.repository }},${{ github.repository_owner }}

jobs:
  sbom:
    name: Generate source SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # output explicitly set to `cyclonedx-json@1.6`, the latest version supported by dtrack
      - name: Generate SBOM from source
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./
          format: cyclonedx-json@1.6
          output-file: sbom-source.cdx.json
          # Explicit, so the download in dt-upload-sbom matches. Left to default, the action
          # derives a name from the format and it stops matching.
          artifact-name: sbom-source.cdx.json
          upload-artifact: true
          upload-artifact-retention: 1
          upload-release-assets: false

  # The parent collection project has to exist before any child project is uploaded.
  dt-create-parent-project:
    name: Ensure the collection parent project exists
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the script
      id-token: write # Tailscale OIDC federated identity requests a JWT from GitHub
    outputs:
      uuid: ${{ steps.parent.outputs.uuid }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions

      - name: Ensure the collection parent project exists or create it
        id: parent
        run: ./.ci/scripts/create-parent-project.py
        env:
          DEPENDENCY_TRACK_HOST: ${{ vars.DEPENDENCY_TRACK_HOST }}
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          PROJECT_NAME: ${{ env.PARENT_PROJECT_NAME }}
          PROJECT_VERSION: ${{ env.PROJECT_VERSION }}
          PROJECT_TAGS: ${{ env.PROJECT_TAGS }}

  dt-upload-sbom:
    name: Upload source SBOM to Dependency-Track
    runs-on: ubuntu-latest
    needs: [sbom, dt-create-parent-project]
    # No GITHUB_TOKEN scopes required: same-run artifacts are fetched with the runtime token.
    permissions:
      id-token: write # Tailscale OIDC federated identity requests a JWT from GitHub
    steps:
      # Extracts into the workspace root, so the file lands where bom-filename expects it.
      - name: Download the source SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-source.cdx.json

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions

      # `parent-name`/`parent-version` attach this to the release collection project, which is
      # what makes AGGREGATE_DIRECT_CHILDREN roll it up. The tags are for filtering only.
      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@d8935b70f527d6aca6bbef5ab02db3933c9a8626 # v4.2.0
        with:
          server-hostname: ${{ vars.DEPENDENCY_TRACK_HOST }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          bom-filename: sbom-source.cdx.json
          project-name: ${{ env.SOURCE_PROJECT_NAME }}
          project-version: ${{ env.PROJECT_VERSION }}
          project-tags: ${{ env.PROJECT_TAGS }}
          parent-name: ${{ env.PARENT_PROJECT_NAME }}
          parent-version: ${{ env.PROJECT_VERSION }}
          auto-create: true

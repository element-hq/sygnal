# GitHub actions workflow which builds and publishes the docker images.

name: Build and push docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# cancel multiple workflow_dispatch on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Single source of truth for the published image.
  IMAGE: docker.io/matrixdotorg/sygnal

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
      platforms: ${{ steps.platform-digests.outputs.platforms }}
      # Tracks the published image tag: `develop`, `latest`, or the git tag instead of duplicating the branch conditions.
      version: ${{ steps.set-tag.outputs.version }}
    permissions:
      contents: read            # checkout codebase
    steps:
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Inspect builder
        run: docker buildx inspect

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Calculate docker image tags
        id: set-tag
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      # we explicitly check out the repository (and use `context: .` in buildx)
      # because we need to preserve the git metadata so that setuptools_scm
      # (part of build system config in pyproject.toml) can deduce the package version.
      # See: https://github.com/marketplace/actions/build-and-push-docker-images#path-context
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push all platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-and-push
        with:
          context: .
          push: true
          labels: "gitsha1=${{ github.sha }}"
          tags: "${{ steps.set-tag.outputs.tags }}"
          file: "docker/Dockerfile"
          platforms: linux/amd64,linux/arm64
          # `docker/build-push-action` v6/v7 enables `provenance=true` by default.
          # Buildkit bundles attestation manifests in the image index as unknown platform entries.
          # https://github.com/goharbor/harbor/issues/22848
          # Prefer tooling able to publish attestations (sbom and provenance) using the OCI referrers API.
          # This is the standard way to associate OCI artifacts without affecting the image digest
          # https://oras.land/docs/concepts/reftypes#the-art-of-associating-artifacts
          provenance: false
          sbom: false
          # ensure the image remains an OCI index. Shouldn't break anything but why risk it
          # https://github.com/opencontainers/image-spec/blob/main/media-types.md
          outputs: type=image,oci-mediatypes=true

      # Resolve the platform manifest digest behind the index, so each one can get its own
      # SBOM generated and attested in a separate job.
      - name: Enumerate platform manifest digests
        id: platform-digests
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" > index.json

          # select(.platform.os != "unknown") drops the unknown/unknown attestation manifests
          # buildkit would add if provenance/sbom were ever re-enabled above.
          platforms=$(jq -c '[ .manifests[]
            | select(.platform.os != "unknown")
            | {name: "\(.platform.os)-\(.platform.architecture)", digest: .digest} ]' index.json)

          [ "$(jq length <<<"$platforms")" -gt 0 ] || {
            echo "::error::no platform manifests found in the image index"; exit 1; }

          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          jq . <<<"$platforms"

  # An SBOM per platform, each attested to the manifest it describes.
  # `actions/attest` accepts exactly one OCI subject per invocation when `push-to-registry` is
  # set, so this is a matrix rather than one multi-subject attestation.
  # Parallel cells are safe: each writes referrers to a distinct subject digest.
  sbom:
    name: Generate SBOM for ${{ matrix.platform.name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write           # keyless sbom attestation
      attestations: write       # gh attestations
      artifact-metadata: write  # write storage record for gh attestation
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.build.outputs.platforms) }}
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Generate an architecture explicit SBOM by scanning the platform manifest digest
      # handed a multi-platform index, syft silently falls back to the runner's own architecture.
      - name: Generate SBOM using Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_DEFAULT_IMAGE_PULL_SOURCE: registry
        with:
          image: ${{ env.IMAGE }}@${{ matrix.platform.digest }}
          format: cyclonedx-json@1.6
          output-file: sbom-${{ matrix.platform.name }}.cdx.json
          artifact-name: sbom-${{ matrix.platform.name }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 1
          upload-release-assets: false

      # `sbom-path` lets the action detect CycloneDX and set the predicate type
      # `push-to-registry` also stores the attestation as an OCI 1.1 referrer
      - name: Attest and push SBOM to docker.io
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ matrix.platform.digest }}
          sbom-path: sbom-${{ matrix.platform.name }}.cdx.json
          push-to-registry: true

  # Sign the image and generate provenance. The SLSA predicate describes the workflow run,
  # not the artifact. It is identical for every platform and attested on the index digest.
  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write           # keyless cosign/provenance
      attestations: write       # gh attestations
      artifact-metadata: write  # write storage record for gh attestation
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Build provenance (SLSA L2+). Attest to the image's index manifest digest.
      # `push-to-registry` stores the attestation as an OCI 1.1 referrer
      - name: Provenance (docker.io)
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      # --recursive signs the image index and the downstream platform/arch manifests,
      # so consumers who resolved to their own architecture can still verify.
      - name: Sign the images with GitHub's OIDC Token
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
            cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

  # Publish SBOMs to Dependency-Track.
  dt-upload-sbom:
    name: Upload ${{ matrix.platform.name }} SBOM to Dependency-Track
    needs: [build, sbom]
    runs-on: ubuntu-latest
    # No GITHUB_TOKEN scopes required: same-run artifacts are fetched with the runtime token.
    permissions:
      id-token: write # Tailscale WIF
    strategy:
      fail-fast: false # one platform failing to upload should not cancel the other
      matrix:
        platform: ${{ fromJSON(needs.build.outputs.platforms) }}
    steps:
      # Download into the workspace root
      - name: Download the SBOM for this platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-${{ matrix.platform.name }}.cdx.json

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
            oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
            audience: ${{ secrets.TS_AUDIENCE }}
            tags: tag:github-actions

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@d8935b70f527d6aca6bbef5ab02db3933c9a8626 # v4.2.0
        with:
          server-hostname: ${{ secrets.DEPENDENCY_TRACK_HOST }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          bom-filename: sbom-${{ matrix.platform.name }}.cdx.json
          project-name: "${{ github.repository }} - ${{ matrix.platform.name }} image"
          # Follows the published image tag rather than the ref: `latest` on main/master,
          # `develop` on develop, the git tag on a tag push. `github.ref_name` would be the
          # branch name on a workflow_dispatch, which matches no published image.
          project-version: ${{ needs.build.outputs.version }}
          project-tags: ${{ github.repository }},${{ github.repository_owner }},${{ matrix.platform.name }}
          auto-create: true
